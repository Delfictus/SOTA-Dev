name: PRISM-DSTW Gates

on:
  pull_request:
  push:

jobs:
  workspace-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install polars pyarrow pyyaml mypy types-PyYAML

      - name: Gate Phase 0
        run: make PYTHON=python3 gate-phase0

  rust-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Rust dependency deny gate
        run: cargo deny check

      - name: Rust format gate
        run: cargo fmt --check

      - name: Rust clippy gate
        run: cargo clippy --workspace --all-targets -- -D warnings
