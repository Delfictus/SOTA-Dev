services:
  demo:
    build: .
    container_name: prism4d-demo
    runtime: nvidia
    ports:
      - "7681:7681"
      - "8080:8080"
    cpus: 4
    mem_limit: 8g
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,display
