path = "src/bin/stress_rt_clustering.rs"
required-features = ["gpu"]

# Path B materializer — offline consumer of the MD-only evidence handoff
# bundle (md_evidence_manifest.json + per-stream PRSPK001/PRSGD001/PRKCC001
# binaries). Pure CPU; does not require the gpu feature. See
# .prism_orchestration/PATHB_MATERIALIZER_SKELETON_REPORT.md.
[[bin]]
name = "prism-materialize-sites"
path = "src/bin/prism_materialize_sites.rs"

# Path B Ghost/ZSTR evidence scanner — offline reader/scorer/provenance
# emitter for Channel-B ghost_tiles.bin + prism_zstr_*.bin. NOT a binding
# site materializer; emits feature artifacts for downstream
# prism-materialize-sites consumption. See
# .prism_orchestration/PATHB_GHOST_EVIDENCE_SCANNER_REPORT.md.
[[bin]]
name = "prism-ghost-evidence-scan"
path = "src/bin/prism_ghost_evidence_scan.rs"

[[bin]]
name = "nhs_rt_full"
path = "src/bin/nhs_rt_full.rs"
required-features = ["gpu"]

[[bin]]
name = "prism-v004-ensemble"
path = "src/bin/prism_v004_ensemble.rs"

[[bin]]
name = "prism-teacher-tags"
path = "src/bin/prism_teacher_tags.rs"

[[bin]]
