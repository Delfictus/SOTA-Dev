[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[[bans.deny]]
name = "duckdb"
reason = "PRISM-DSTW lineage is Arrow/Polars-native; DuckDB is banned from production dependency trees."

[[bans.deny]]
name = "rusqlite"
reason = "SQLite-class analytics are banned from PRISM-DSTW production dependency trees; D1 metadata access must be isolated outside analytical lineage."

[[bans.deny]]
name = "libsqlite3-sys"
reason = "SQLite native bindings are banned from PRISM-DSTW production dependency trees."

[[bans.deny]]
name = "sqlx-sqlite"
reason = "SQLite-backed SQLx is banned from PRISM-DSTW production dependency trees."

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "none"
